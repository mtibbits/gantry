# A fictional devagent config for the capacity reader's tests (#39).
# A project whose name holds a dot, paused. devagent's own project list leaves
# such a name out; Gantry reads it.

[capacity]
operator_hours_per_week = 20
lane_hours_per_week = 40
max_lanes = 3
tokens_per_week = 500000000
tokens_per_window = 60000000
windows_per_week = 10

[project.a]
devdoc_dir = "a"

[project.b]
devdoc_dir = "b"

[project.c]
devdoc_dir = "c"

[project."a.b"]
devdoc_dir = "a.b"

[project."a.b".capacity]
paused = true
