[project.a]
devdoc_dir = "a"

[project.a.capacity]
reserve_operator_hours_per_week = 12.5

[project.b]
devdoc_dir = "b"

[project.b.capacity]
reserve_operator_hours_per_week = 8

[project.c]
devdoc_dir = "c"
