<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>{{TITLE}}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* The worksite page's sheet, cut down to one text column. */
:root {
  --bg: #f3f4f6; --sheet: #ffffff; --ink: #18202c; --muted: #5d6878; --rule: #d6dbe3; --link: #3a55c9;
  --f-display: "Arial Narrow", "Segoe UI", system-ui, sans-serif;
  --f-body: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --f-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f131a; --sheet: #161c25; --ink: #e5e9ef; --muted: #98a3b3; --rule: #2b3442; --link: #8fa3ff; }
}
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); }
.wrap { max-width: 56rem; margin: 0 auto; padding: 2rem 1.25rem 3rem; background: var(--sheet); min-height: 100vh; }
h1 { font: 600 2rem/1.2 var(--f-display); margin: .25rem 0 1rem; }
.label { color: var(--muted); font-size: .85rem; margin: .25rem 0; }
ul { padding-left: 1.25rem; }
#warnings li { color: var(--muted); }
#sites li { margin: .35rem 0; }
#sites a { color: var(--link); font-family: var(--f-mono); }
#sites .name { font-family: var(--f-mono); }
#sites .reason { color: var(--muted); }
</style>
</head>
<body>
<main class="wrap">
  {{STAMP}}
  <h1>{{TITLE}}</h1>
  <div id="headline">{{HEADLINE}}</div>
  <ul id="warnings">{{WARNINGS}}</ul>
  <p class="label">{{FINISH_LABEL}}</p>
  <ul id="sites">{{SITES}}</ul>
  <ul id="view-links">{{VIEW_LINKS}}</ul>
</main>
<script type="application/json" id="gantry-data">{{DATA}}</script>
</body>
</html>
