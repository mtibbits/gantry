# Every name here is fictional: gantry's sample installation (#7).
# Paths are relative to this file's folder (samples/).
config_version = 2
devagent_config = "devagent/config.toml"
# devagent's portfolio JSON over the sample devagent config: tools/sample_portfolio.py
# writes it (the demo build runs it, docs/demo.md).
portfolio_json = "devagent/out/portfolio/portfolio.json"
output_dir = "out"
as_of = 2026-01-20
portfolio_file = "portfolio.md"
fires_list = "fires.md"

[site.lighthouse]
requirements = "lighthouse/requirements.md"
history = "history/out/lighthouse"

# The sample WBS.md history (#28), built by tools/sample_history.py.
[site.harbor]
history = "history/out/harbor"

[site.orchard]
history = "history/out/orchard"
