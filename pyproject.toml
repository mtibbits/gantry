[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gantry"
version = "0.0.0"
description = "Planning pages for many projects, built from devagent WBS files"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
gantry = "gantry.cli:main"

[tool.setuptools]
packages = ["gantry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tools"]
