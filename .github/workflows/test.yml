name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Node.js is a development-only tool for the page-script harness
      # (docs/page-safety.md); installed Gantry never needs it.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --prefix tests/page_script
      - run: python -m pip install -e ".[dev]"
      # The sample WBS.md history the history tests read (#28, docs/wbs-history.md).
      - run: python tools/sample_history.py
      - run: python -m pytest -q -rs
      # The console script, unconditionally: the matching test skips when
      # gantry is not on PATH, and a skip is never the only evidence.
      - run: gantry build --config samples/gantry.sample.toml
