name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Node.js is a development-only tool for the page-script harness
      # (docs/page-safety.md); installed Gantry never needs it.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --prefix tests/page_script
      - run: python -m pip install -e ".[dev]"
      # The sample WBS.md history the history tests read (#28, docs/wbs-history.md).
      - run: python tools/sample_history.py
      # devagent at the pinned release (tests/devagent.pin), for the contract
      # test (#31), checked against the commit the fixtures were written at
      # (their provenance.json). The test itself runs only on Linux.
      - shell: bash
        run: |
          git clone -q --depth 1 --branch "$(cat tests/devagent.pin)" https://github.com/mtibbits/devagent "$RUNNER_TEMP/devagent"
          want="$(python -c 'import json, sys; print(json.loads(open(sys.argv[1], "rb").read())["devagent_commit"])' tests/fixtures/devagent_records/written/Issue-6/provenance.json)"
          got="$(git -C "$RUNNER_TEMP/devagent" rev-parse HEAD)"
          test "$got" = "$want" || { echo "$(cat tests/devagent.pin) is at $got; the fixtures were written at $want"; exit 1; }
          echo "GANTRY_DEVAGENT_DIR=$RUNNER_TEMP/devagent" >> "$GITHUB_ENV"
      - run: python -m pytest -q -rs
      # The sample portfolio JSON the sample config reads (#12), written by the
      # pinned devagent's own aggregator. Linux only: devagent's toolchain is
      # bash and GNU coreutils (docs/demo.md).
      - if: runner.os == 'Linux'
        run: python tools/sample_portfolio.py
      # The console script: the matching test skips when gantry is not on
      # PATH, and a skip is never the only evidence. Linux only, as the
      # document it reads.
      - if: runner.os == 'Linux'
        run: gantry build --config samples/gantry.sample.toml
